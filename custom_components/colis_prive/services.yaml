track_parcel:
  fields:
    tracking_code:
      required: true
      example: "123456789012"
      selector:
        text:
    country:
      required: false
      example: "be"
      selector:
        select:
          options:
            - fr
            - be
            - lu
    postal_code:
      required: false
      example: "1000"
      selector:
        text:
    contents:
      required: false
      example: "Running shoes"
      selector:
        text:

untrack_parcel:
  fields:
    tracking_code:
      required: true
      example: "123456789012"
      selector:
        text:
    country:
      required: false
      example: "be"
      selector:
        select:
          options:
            - fr
            - be
            - lu
    postal_code:
      required: false
      example: "1000"
      selector:
        text:

update_contents:
  fields:
    tracking_code:
      required: true
      example: "123456789012"
      selector:
        text:
    contents:
      required: false
      example: "Running shoes"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: colis_prive
