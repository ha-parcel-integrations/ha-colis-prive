# Notify exactly once per parcel when Colis Privé says it's on the
# delivery vehicle today. Filters on the normalised
# ParcelStatus.OUT_FOR_DELIVERY value so this is independent of the raw
# Colis Privé status strings. Colis Privé gives no time of day, so the
# message just says "today".

alias: "Colis Privé: parcel out for delivery"
description: Notify when a Colis Privé parcel goes out for delivery today.
mode: queued
max: 10

triggers:
  - trigger: event
    event_type: colis_prive_parcel_status_changed
    event_data:
      new_status: out_for_delivery

actions:
  - action: notify.mobile_app
    data:
      title: "Parcel out for delivery today"
      message: >-
        {{ trigger.event.data.sender or trigger.event.data.barcode }} is being
        delivered today.
      data:
        clickAction: "{{ trigger.event.data.url }}"
