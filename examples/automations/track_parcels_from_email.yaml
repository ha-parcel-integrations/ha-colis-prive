# Extract Colis Privé tracking codes from incoming e-mail and register them
# with `colis_prive.track_parcel`, so parcels start tracking the moment the
# shipping confirmation lands in your inbox — no manual entry.
#
# Requirements:
#   - one or more core IMAP config entries with "text" enabled under
#     "message data" and the max message size raised (carrier mails are
#     long) — full setup guide and pitfalls: track_parcels_from_email.md
#   - optional: an `ai_task` entity for the AI fallback branch; delete
#     the whole `else:` block if you don't use one
#   - PRIVACY: by default this fires on EVERY incoming mail and (with the
#     AI branch) can send mail bodies to your AI Task. Scope the IMAP
#     search to the carrier's sender first — see "Scope & privacy" in the .md.
#
# The regex is deliberately written without backslashes (`(?<![0-9A-Za-z])`
# instead of `\b`, `[0-9]` instead of `\d`): Jinja treats `\b` inside a
# string literal as a backspace escape, so the pattern would silently
# never match.

alias: "Colis Privé: track from e-mail"
description: >-
  Listens to imap_content events from all IMAP entries. Fast regex path for
  Colis Privé tracking codes; optional AI fallback for mails whose layout the
  regex does not recognise.
mode: queued
max: 10

triggers:
  - trigger: event
    event_type: imap_content

variables:
  sender: "{{ trigger.event.data.sender | default('') | lower }}"
  subject: "{{ trigger.event.data.subject | default('') }}"
  body: "{{ trigger.event.data.text | default('') }}"
  content: "{{ subject ~ ' ' ~ body }}"
  # Leave both empty while a single Colis Privé hub is set up. With several
  # hubs, set the country (fr, be or lu) and postal code of the delivery
  # address this automation should track for.
  hub_country: ""
  hub_postal_code: ""
  # Colis Privé numbers have no stable public prefix; the only shape seen is
  # 12 digits. That is too common to match in any mail, so only mails that
  # mention Colis Privé are searched.
  mentions_colis_prive: >-
    {{ content | lower is search('colis priv|colisprive') }}
  colis_prive_codes: >-
    {{ content | regex_findall('(?<![0-9A-Za-z])[0-9]{12}(?![0-9A-Za-z])')
       | unique | list if mentions_colis_prive else [] }}
  # Keyword gate for the AI fallback — localise to your language(s).
  is_parcel_mail: >-
    {{ content | lower is search('package|shipped|out for delivery|track|shipment|delivery') }}

conditions:
  # initial=true means "new message"; false means a duplicate trigger of
  # the SAME message (e.g. after a reconnect) — requiring it is free dedup.
  - condition: template
    value_template: "{{ trigger.event.data.initial | default(true) }}"
  - condition: template
    value_template: "{{ is_parcel_mail or colis_prive_codes | count > 0 }}"

actions:
  - repeat:
      for_each: "{{ colis_prive_codes }}"
      sequence:
        - action: colis_prive.track_parcel
          data:
            tracking_code: "{{ repeat.item }}"
            country: "{{ hub_country }}"
            postal_code: "{{ hub_postal_code }}"
  - if:
      - condition: template
        value_template: "{{ colis_prive_codes | count > 0 }}"
    then:
      - action: notify.mobile_app_your_phone
        data:
          title: "📦 Colis Privé parcel picked up from mail"
          message: >-
            {{ colis_prive_codes | join(', ') }} (mail from {{ sender }})
    else:
      # ---- Optional AI fallback — delete this block if you have no ai_task entity ----
      - action: ai_task.generate_data
        data:
          task_name: colis_prive-tracking-code-extraction
          entity_id: ai_task.your_ai_task_entity
          instructions: >-
            Below is an e-mail. Determine whether it contains a Colis Privé
            parcel tracking code. Colis Privé codes are
            12 characters (letters and digits), usually 12 digits, without
            the postal code. Only return a real tracking
            code, never an order, customer or invoice number. If the
            mail is from a different carrier, answer 'other'. When in
            doubt: 'none'.

            Sender: {{ sender }}
            Subject: {{ subject }}
            Body:
            {{ body[:6000] }}
          structure:
            carrier:
              description: Whether a Colis Privé tracking code was found
              required: true
              selector:
                select:
                  options: ["colis_prive", "other", "none"]
            tracking_code:
              description: The tracking code, or empty if none
              required: false
              selector:
                text:
        response_variable: ai_result
      - choose:
          - conditions: "{{ ai_result.data.carrier == 'colis_prive' and (ai_result.data.tracking_code | default('') | trim) != '' }}"
            sequence:
              - action: colis_prive.track_parcel
                data:
                  tracking_code: "{{ ai_result.data.tracking_code | trim }}"
                  country: "{{ hub_country }}"
                  postal_code: "{{ hub_postal_code }}"
              - action: notify.mobile_app_your_phone
                data:
                  title: "📦 Colis Privé parcel picked up from mail (AI)"
                  message: "{{ ai_result.data.tracking_code | trim }} (mail from {{ sender }})"
          - conditions: "{{ ai_result.data.carrier == 'other' and (ai_result.data.tracking_code | default('') | trim) != '' }}"
            sequence:
              - action: notify.mobile_app_your_phone
                data:
                  title: "📦 Tracking number found – not a Colis Privé parcel"
                  message: "{{ ai_result.data.tracking_code | trim }} (mail from {{ sender }}, subject: {{ subject }})"
